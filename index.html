<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Meter</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --border:#e2e4e9;
    --text:#1f2328;
    --text-muted:#6b7280;
    --primary:#2563eb;
    --primary-hover:#1d4ed8;
    --danger:#dc2626;
    --danger-hover:#b91c1c;
    --success:#16a34a;
    --radius:12px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:28px 20px 8px;
    text-align:center;
  }
  header h1{
    margin:0 0 4px;
    font-size:26px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  header p{
    margin:0;
    color:var(--text-muted);
    font-size:14px;
  }
  main{
    flex:1;
    width:100%;
    max-width:960px;
    margin:0 auto;
    padding:20px;
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
  }
  @media (min-width:820px){
    main{
      grid-template-columns: 1fr 1fr;
      align-items:start;
    }
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
  }
  .card h2{
    margin:0 0 14px;
    font-size:16px;
    font-weight:600;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    color:var(--text);
  }
  textarea{
    width:100%;
    min-height:100px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    font-size:14px;
    font-family:inherit;
    background:#fafbfc;
    color:var(--text);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(37,99,235,0.12);
    background:#fff;
  }
  .btn{
    border:none;
    border-radius:10px;
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background-color .15s ease, transform .05s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{
    background:var(--primary);
    color:#fff;
  }
  .btn-primary:hover{ background:var(--primary-hover); }
  .btn-primary:disabled{
    background:#93b4f0;
    cursor:not-allowed;
  }
  .btn-secondary{
    background:#eef1f5;
    color:var(--text);
  }
  .btn-secondary:hover{ background:#e2e6ec; }
  .btn-danger{
    background:#fdecec;
    color:var(--danger);
  }
  .btn-danger:hover{ background:#fbd8d8; }
  .btn-danger-solid{
    background:var(--danger);
    color:#fff;
  }
  .btn-danger-solid:hover{ background:var(--danger-hover); }
  .btn-icon{
    background:transparent;
    color:var(--text-muted);
    padding:6px 8px;
    border-radius:8px;
  }
  .btn-icon:hover{
    background:#fdecec;
    color:var(--danger);
  }
  .actions-row{
    display:flex;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .qr-display{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:260px;
    border:1.5px dashed var(--border);
    border-radius:10px;
    background:#fafbfc;
    padding:20px;
    text-align:center;
  }
  .qr-display.has-qr{
    border-style:solid;
    background:#fff;
  }
  .qr-display img{
    image-rendering:pixelated;
    max-width:220px;
    width:100%;
    height:auto;
    border-radius:6px;
  }
  .placeholder-text{
    color:var(--text-muted);
    font-size:14px;
  }
  .error-box{
    margin-top:12px;
    background:#fdecec;
    color:var(--danger);
    border:1px solid #f8c9c9;
    border-radius:8px;
    padding:10px 12px;
    font-size:13px;
    display:none;
  }
  .error-box.visible{ display:block; }
  .history-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:8px;
  }
  .history-header h2{ margin:0; }
  .history-count{
    font-size:12px;
    color:var(--text-muted);
    background:#eef1f5;
    padding:3px 9px;
    border-radius:20px;
    font-weight:600;
  }
  .history-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:480px;
    overflow-y:auto;
    padding-right:4px;
  }
  .history-item{
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    background:#fafbfc;
  }
  .history-item img{
    width:52px;
    height:52px;
    border-radius:6px;
    border:1px solid var(--border);
    background:#fff;
    flex-shrink:0;
    image-rendering:pixelated;
    cursor:pointer;
    transition: transform .1s ease;
  }
  .history-item img:hover{
    transform:scale(1.05);
  }
  .history-item-info{
    flex:1;
    min-width:0;
    cursor:pointer;
    border-radius:6px;
  }
  .history-item-info:hover .history-item-text{
    color:var(--primary);
  }
  .history-item-text{
    font-size:13px;
    font-weight:600;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .history-item-date{
    font-size:11px;
    color:var(--text-muted);
    margin-top:2px;
  }
  .empty-history{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    padding:30px 10px;
  }
  .clear-all-wrap{
    margin-top:14px;
    text-align:right;
  }
  footer{
    text-align:center;
    padding:18px;
    font-size:12px;
    color:var(--text-muted);
  }
  #toast-container{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    gap:8px;
    z-index:9999;
    align-items:center;
  }
  .toast{
    background:#1f2328;
    color:#fff;
    padding:10px 18px;
    border-radius:30px;
    font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,0.2);
    opacity:0;
    transform:translateY(10px);
    animation: toast-in .25s ease forwards, toast-out .25s ease forwards 2.2s;
  }
  .toast.success{ background:#16a34a; }
  .toast.error{ background:#dc2626; }
  @keyframes toast-in{
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes toast-out{
    to{ opacity:0; transform:translateY(-10px); }
  }
  #qr-render-target{ display:flex; justify-content:center; }
</style>
</head>
<body>

<header>
  <h1>📱 QR Code Meter</h1>
  <p>Genera y guarda códigos QR — funciona 100% offline</p>
</header>

<main>
  <section class="card">
    <h2>Generar código QR</h2>
    <label for="qr-input">Texto o URL:</label>
    <textarea id="qr-input" placeholder="Escribe o pega un texto, URL, etc."></textarea>
    <div class="actions-row">
      <button class="btn btn-primary" id="generate-btn">Generar QR</button>
    </div>
    <div class="error-box" id="error-box"></div>

    <div style="margin-top:20px;">
      <div class="qr-display" id="qr-display">
        <span class="placeholder-text" id="qr-placeholder">Tu código QR aparecerá aquí</span>
        <div id="qr-render-target"></div>
      </div>
      <div class="actions-row" id="qr-actions" style="display:none;">
        <button class="btn btn-secondary" id="save-btn">💾 Guardar en historial</button>
        <button class="btn btn-secondary" id="download-btn">⬇️ Descargar PNG</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="history-header">
      <h2>Historial</h2>
      <span class="history-count" id="history-count">0 items</span>
    </div>
    <div class="history-list" id="history-list">
      <div class="empty-history" id="empty-history">Aún no hay códigos guardados.</div>
    </div>
    <div class="clear-all-wrap">
      <button class="btn btn-danger" id="clear-all-btn">🗑️ Borrar todo el historial</button>
    </div>
  </section>
</main>

<footer>Hecho con ♥ · Funciona offline</footer>

<div id="toast-container"></div>

<!--

  Librería QR embebida (basada en qrcode.js de davidshimjs,
  a su vez basada en la implementación original de Kazuhiko Arase).

<script>
//---------------------------------------------------------------------
// QRCode for JavaScript (embedded, no external dependencies)
//---------------------------------------------------------------------
var QRCode;
(function(){

//---------------------------------------------------------------------
// QRCode
//---------------------------------------------------------------------

function QRCodeImpl(el, vOption) {
  this._htOption = {
    width : 256,
    height : 256,
    typeNumber : 4,
    colorDark : "#000000",
    colorLight : "#ffffff",
    correctLevel : QRErrorCorrectLevel.H
  };

  if (typeof vOption === 'string') {
    vOption = { text : vOption };
  }

  if (vOption) {
    for (var i in vOption) {
      this._htOption[i] = vOption[i];
    }
  }

  if (typeof el == "string") {
    el = document.getElementById(el);
  }

  this._el = el;
  this._oQRCode = null;
  this._oDrawing = new Drawing(this._el, this._htOption);

  if (this._htOption.text) {
    this.makeCode(this._htOption.text);
  }
}

QRCodeImpl.prototype.makeCode = function (sText) {
  this._oQRCode = new QRCodeModel(_getTypeNumber(sText, this._htOption.correctLevel), this._htOption.correctLevel);
  this._oQRCode.addData(sText);
  this._oQRCode.make();
  this._el.title = sText;
  this._oDrawing.draw(this._oQRCode);
  this.makeImage();
};

QRCodeImpl.prototype.makeImage = function () {
  if (typeof this._oDrawing.makeImage == "function") {
    this._oDrawing.makeImage();
  }
};

QRCodeImpl.prototype.clear = function () {
  this._oDrawing.clear();
};

// Auto type number selection
function _getTypeNumber(sText, nCorrectLevel) {
  var nType = 10;
  var length = _getUTF8Length(sText);

  for (var i = 0, len = QRCodeLimitLength.length; i <= len; i++) {
    var nLimit = 0;
    switch (nCorrectLevel) {
      case QRErrorCorrectLevel.L :
        nLimit = QRCodeLimitLength[i][0];
        break;
      case QRErrorCorrectLevel.M :
        nLimit = QRCodeLimitLength[i][1];
        break;
      case QRErrorCorrectLevel.Q :
        nLimit = QRCodeLimitLength[i][2];
        break;
      case QRErrorCorrectLevel.H :
        nLimit = QRCodeLimitLength[i][3];
        break;
    }

    if (length <= nLimit) {
      nType = i + 1;
      break;
    }
  }

  if (nType > QRCodeLimitLength.length) {
    throw new Error("Too long data");
  }

  return nType;
}

function _getUTF8Length(sText) {
  var replacedText = encodeURI(sText).toString().replace(/\%[0-9a-fA-F]{2}/g, 'a');
  return replacedText.length + (replacedText.length != sText.length ? 3 : 0);
}

//---------------------------------------------------------------------
// Drawing (Canvas based)
//---------------------------------------------------------------------

function Drawing(el, htOption) {
  this._bIsPainted = false;
  this._android = _getAndroid();

  this._htOption = htOption;
  this._elCanvas = document.createElement("canvas");
  this._elCanvas.width = htOption.width;
  this._elCanvas.height = htOption.height;
  el.appendChild(this._elCanvas);
  this._el = el;
  this._oContext = this._elCanvas.getContext("2d");
  this._bIsPainted = false;
  this._elImage = document.createElement("img");
  this._elImage.setAttribute("alt", "QR code");
  this._elImage.style.display = "none";
  this._el.appendChild(this._elImage);
  this._bSupportDataURI = null;
}

Drawing.prototype.draw = function (oQRCode) {
  var _elImage = this._elImage;
  var _oContext = this._oContext;
  var _htOption = this._htOption;

  var nCount = oQRCode.getModuleCount();
  var nWidth = _htOption.width / nCount;
  var nHeight = _htOption.height / nCount;
  var nRoundedWidth = Math.round(nWidth);
  var nRoundedHeight = Math.round(nHeight);

  _elImage.style.display = "none";
  this.clear();

  for (var row = 0; row < nCount; row++) {
    for (var col = 0; col < nCount; col++) {
      var bIsDark = oQRCode.isDark(row, col);
      var nLeft = col * nWidth;
      var nTop = row * nHeight;
      _oContext.strokeStyle = bIsDark ? _htOption.colorDark : _htOption.colorLight;
      _oContext.lineWidth = 1;
      _oContext.fillStyle = bIsDark ? _htOption.colorDark : _htOption.colorLight;
      _oContext.fillRect(nLeft, nTop, nWidth, nHeight);

      _oContext.strokeRect(
        Math.floor(nLeft) + 0.5,
        Math.floor(nTop) + 0.5,
        nRoundedWidth,
        nRoundedHeight
      );

      _oContext.strokeRect(
        Math.ceil(nLeft) - 0.5,
        Math.ceil(nTop) - 0.5,
        nRoundedWidth,
        nRoundedHeight
      );
    }
  }

  this._bIsPainted = true;
};

Drawing.prototype.makeImage = function () {
  if (this._bIsPainted) {
    _safeSetDataURI.call(this, _onMakeImage);
  }
};

Drawing.prototype.isPainted = function () {
  return this._bIsPainted;
};

Drawing.prototype.clear = function () {
  this._oContext.clearRect(0, 0, this._elCanvas.width, this._elCanvas.height);
  this._bIsPainted = false;
};

function _onMakeImage() {
  this._elImage.src = this._elCanvas.toDataURL("image/png");
  this._elImage.style.display = "block";
  this._elCanvas.style.display = "none";
}

function _getAndroid() {
  var android = false;
  var sAgent = navigator.userAgent;
  if (/android/i.test(sAgent)) {
    android = true;
    var aMat = sAgent.toString().match(/android ([0-9]\.[0-9])/i);
    if (aMat && aMat[1]) {
      android = parseFloat(aMat[1]);
    }
  }
  return android;
}

var _bSupportDataURI = null;
function _safeSetDataURI(fSuccess, fFail) {
  var self = this;
  self._fFail = fFail;
  self._fSuccess = fSuccess;

  if (_bSupportDataURI === null) {
    var el = document.createElement("img");
    var fOnError = function() {
      self._bSupportDataURI = false;
      if (self._fFail) {
        self._fFail.call(self);
      }
    };
    var fOnSuccess = function() {
      self._bSupportDataURI = true;
      if (self._fSuccess) {
        self._fSuccess.call(self);
      }
    };
    el.onabort = fOnError;
    el.onerror = fOnError;
    el.onload = fOnSuccess;
    el.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAUEBAAAACwAAAAAAQABAAACAkQBADs="; // 1x1 gif
    return;
  } else if (_bSupportDataURI === true && self._fSuccess) {
    self._fSuccess.call(self);
  } else if (_bSupportDataURI === false && self._fFail) {
    self._fFail.call(self);
  }
}

//---------------------------------------------------------------------
// QRCodeModel
//---------------------------------------------------------------------

var QRMode = { MODE_NUMBER : 1 << 0, MODE_ALPHA_NUM : 1 << 1, MODE_8BIT_BYTE : 1 << 2, MODE_KANJI : 1 << 3 };
var QRErrorCorrectLevel = { L : 1, M : 0, Q : 3, H : 2 };
var QRMaskPattern = { PATTERN000 : 0, PATTERN001 : 1, PATTERN010 : 2, PATTERN011 : 3, PATTERN100 : 4, PATTERN101 : 5, PATTERN110 : 6, PATTERN111 : 7 };

var QRCodeLimitLength = [
  [17, 14, 11, 7], [32, 26, 20, 14], [53, 42, 32, 24], [78, 62, 46, 34], [106, 84, 60, 44],
  [134, 106, 74, 58], [154, 122, 86, 64], [192, 152, 108, 84], [230, 180, 130, 98], [271, 213, 151, 119],
  [321, 251, 177, 137], [367, 287, 203, 155], [425, 331, 241, 177], [458, 362, 258, 194], [520, 412, 292, 220],
  [586, 450, 322, 250], [644, 504, 364, 280], [718, 560, 394, 310], [792, 624, 442, 338], [858, 666, 482, 382],
  [929, 711, 509, 403], [1003, 779, 565, 439], [1091, 857, 611, 461], [1171, 911, 661, 511], [1273, 997, 715, 535],
  [1367, 1059, 751, 593], [1465, 1125, 805, 625], [1528, 1190, 868, 658], [1628, 1264, 908, 698], [1732, 1370, 982, 742],
  [1840, 1452, 1030, 790], [1952, 1538, 1112, 842], [2068, 1628, 1168, 898], [2188, 1722, 1228, 958], [2303, 1809, 1283, 983],
  [2431, 1911, 1351, 1051], [2563, 1989, 1423, 1093], [2699, 2099, 1499, 1139], [2809, 2213, 1579, 1219], [2953, 2331, 1663, 1273]
];

function QRPolynomial(num, shift) {
  if (num.length == undefined) { throw new Error(num.length + "/" + shift); }
  var offset = 0;
  while (offset < num.length && num[offset] == 0) { offset++; }
  this.num = new Array(num.length - offset + shift);
  for (var i = 0; i < num.length - offset; i++) { this.num[i] = num[i + offset]; }
}
QRPolynomial.prototype = {
  get : function(index) { return this.num[index]; },
  getLength : function() { return this.num.length; },
  multiply : function(e) {
    var num = new Array(this.getLength() + e.getLength() - 1);
    for (var i = 0; i < this.getLength(); i++) {
      for (var j = 0; j < e.getLength(); j++) {
        num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
      }
    }
    return new QRPolynomial(num, 0);
  },
  mod : function(e) {
    if (this.getLength() - e.getLength() < 0) { return this; }
    var ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
    var num = new Array(this.getLength());
    for (var i = 0; i < this.getLength(); i++) { num[i] = this.get(i); }
    for (var i = 0; i < e.getLength(); i++) { num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio); }
    return new QRPolynomial(num, 0).mod(e);
  }
};

var QRMath = {
  glog : function(n) { if (n < 1) { throw new Error("glog(" + n + ")"); } return QRMath.LOG_TABLE[n]; },
  gexp : function(n) { while (n < 0) { n += 255; } while (n >= 256) { n -= 255; } return QRMath.EXP_TABLE[n]; },
  EXP_TABLE : new Array(256),
  LOG_TABLE : new Array(256)
};
for (var i = 0; i < 8; i++) { QRMath.EXP_TABLE[i] = 1 << i; }
for (var i = 8; i < 256; i++) {
  QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4] ^ QRMath.EXP_TABLE[i - 5] ^ QRMath.EXP_TABLE[i - 6] ^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) { QRMath.LOG_TABLE[QRMath.EXP_TABLE[i]] = i; }

var QRUtil = {
  PATTERN_POSITION_TABLE : [
    [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50],
    [6, 30, 54], [6, 32, 58], [6, 34, 62], [6, 26, 46, 66], [6, 26, 48, 70], [6, 26, 50, 74], [6, 30, 54, 78],
    [6, 30, 56, 82], [6, 30, 58, 86], [6, 34, 62, 90], [6, 28, 50, 72, 94], [6, 26, 50, 74, 98], [6, 30, 54, 78, 102],
    [6, 28, 54, 80, 106], [6, 32, 58, 84, 110], [6, 30, 58, 86, 114], [6, 34, 62, 90, 118], [6, 26, 50, 74, 98, 122],
    [6, 30, 54, 78, 102, 126], [6, 26, 52, 78, 104, 130], [6, 30, 56, 82, 108, 134], [6, 34, 60, 86, 112, 138],
    [6, 30, 58, 86, 114, 142], [6, 34, 62, 90, 118, 146], [6, 30, 54, 78, 102, 126, 150], [6, 24, 50, 76, 102, 128, 154],
    [6, 28, 54, 80, 106, 132, 158], [6, 32, 58, 84, 110, 136, 162], [6, 26, 54, 82, 110, 138, 166], [6, 30, 58, 86, 114, 142, 170]
  ],
  G15 : (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
  G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
  G15_MASK : (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1),
  getBCHTypeInfo : function(data) {
    var d = data << 10;
    while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) { d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15))); }
    return ((data << 10) | d) ^ QRUtil.G15_MASK;
  },
  getBCHTypeNumber : function(data) {
    var d = data << 12;
    while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) { d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18))); }
    return (data << 12) | d;
  },
  getBCHDigit : function(data) {
    var digit = 0;
    while (data != 0) { digit++; data >>>= 1; }
    return digit;
  },
  getPatternPosition : function(typeNumber) { return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1]; },
  getMask : function(maskPattern, i, j) {
    switch (maskPattern) {
      case QRMaskPattern.PATTERN000 : return (i + j) % 2 == 0;
      case QRMaskPattern.PATTERN001 : return i % 2 == 0;

    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error("Error leyendo historial:", e);
      return [];
    }
  }

  function setHistory(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      console.error("Error guardando historial:", e);
      showToast("No se pudo guardar (almacenamiento lleno)", "error");
      return false;
    }
  }

  function formatDate(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleString();
    } catch (e) {
      return iso;
    }
  }

  function renderHistory() {
    var history = getHistory();
    historyCount.textContent = history.length + (history.length === 1 ? " item" : " items");

    historyList.innerHTML = "";

    if (history.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-history";
      empty.id = "empty-history";
      empty.textContent = "Aún no hay códigos guardados.";
      historyList.appendChild(empty);
      return;
    }

    // Most recent first
    var ordered = history.slice().reverse();
    ordered.forEach(function(item){
      var row = document.createElement("div");
      row.className = "history-item";

      var img = document.createElement("img");
      img.src = item.image;
      img.alt = "QR guardado";
      img.title = "Clic para abrir en el área principal";
      img.addEventListener("click", function(){
        loadFromHistory(item);
      });

      var info = document.createElement("div");
      info.className = "history-item-info";
      info.title = "Clic para abrir en el área principal";
      info.addEventListener("click", function(){
        loadFromHistory(item);
      });

      var textEl = document.createElement("div");
      textEl.className = "history-item-text";
      textEl.textContent = item.text;
      textEl.title = item.text;

      var dateEl = document.createElement("div");
      dateEl.className = "history-item-date";
      dateEl.textContent = formatDate(item.date);

      info.appendChild(textEl);
      info.appendChild(dateEl);

      var delBtn = document.createElement("button");
      delBtn.className = "btn btn-icon";
      delBtn.title = "Eliminar";
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", function(){
        deleteHistoryItem(item.id);
      });

      row.appendChild(img);
      row.appendChild(info);
      row.appendChild(delBtn);
      historyList.appendChild(row);
    });
  }

  function resetQrDisplay() {
    qrRenderTarget.innerHTML = "";
    qrPlaceholder.style.display = "block";
    qrDisplay.classList.remove("has-qr");
    qrActions.style.display = "none";
    currentQrDataUrl = null;
    currentQrText = null;
    currentQrHistoryId = null;
    input.value = "";
    clearError();
    updateGenerateButtonState();
  }

  function loadFromHistory(item) {
    clearError();
    input.value = item.text;
    updateGenerateButtonState();

    qrRenderTarget.innerHTML = "";
    qrPlaceholder.style.display = "none";

    var img = document.createElement("img");
    img.src = item.image;
    img.alt = "QR restaurado del historial";
    qrRenderTarget.appendChild(img);

    qrDisplay.classList.add("has-qr");
    qrActions.style.display = "flex";

    currentQrDataUrl = item.image;
    currentQrText = item.text;
    currentQrHistoryId = item.id;

    window.scrollTo({ top: 0, behavior: "smooth" });
    showToast("QR cargado desde el historial");
  }

  function deleteHistoryItem(id) {
    var history = getHistory();
    var filtered = history.filter(function(item){ return item.id !== id; });
    if (setHistory(filtered)) {
      renderHistory();
      if (currentQrHistoryId === id) {
        resetQrDisplay();
      }
      showToast("Elemento eliminado", "success");
    }
  }

  function saveToHistory() {
    if (!currentQrDataUrl || !currentQrText) {
      showToast("Genera un código QR primero", "error");
      return;
    }
    var history = getHistory();
    var alreadyExists = history.some(function(item){
      return item.text === currentQrText;
    });
    if (alreadyExists) {
      showError("Este texto/URL ya está guardado en el historial.");
      showToast("Ya existe en el historial", "error");
      return;
    }
    var entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      text: currentQrText,
      date: new Date().toISOString(),
      image: currentQrDataUrl
    };
    history.push(entry);
    if (setHistory(history)) {
      renderHistory();
      showToast("Guardado en historial", "success");
    }
  }

  function downloadPng() {
    if (!currentQrDataUrl) {
      showToast("Genera un código QR primero", "error");
      return;
    }
    try {
      var link = document.createElement("a");
      var safeName = (currentQrText || "qr-code").replace(/[^a-z0-9]+/gi, "-").toLowerCase().slice(0, 40) || "qr-code";
      link.download = "qr-" + safeName + ".png";
      link.href = currentQrDataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("PNG descargado", "success");
    } catch (e) {
      console.error(e);
      showToast("No se pudo descargar el archivo", "error");
    }
  }

  function clearAllHistory() {
    var history = getHistory();
    if (history.length === 0) {
      showToast("El historial ya está vacío");
      return;
    }
    var confirmed = confirm("¿Seguro que quieres borrar todo el historial? Esta acción no se puede deshacer.");
    if (confirmed) {
      if (setHistory([])) {
        renderHistory();
        resetQrDisplay();
        showToast("Historial borrado", "success");
      }
    }
  }

  function generateQr() {
    clearError();
    var text = input.value.trim();
    if (!text) {
      showError("Escribe un texto o URL antes de generar el código.");
      return;
    }

    try {
      qrRenderTarget.innerHTML = "";
      qrPlaceholder.style.display = "none";

      qrInstance = new QRCode(qrRenderTarget, {
        text: text,
        width: 220,
        height: 220,
        colorDark: "#1f2328",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      qrDisplay.classList.add("has-qr");
      qrActions.style.display = "flex";

      // Give the drawing routine a tick to render the canvas/image
      setTimeout(function(){
        try {
          var canvas = qrRenderTarget.querySelector("canvas");
          var img = qrRenderTarget.querySelector("img");
          var dataUrl = null;
          if (canvas) {
            dataUrl = canvas.toDataURL("image/png");
          } else if (img && img.src && img.src.indexOf("data:image") === 0) {
            dataUrl = img.src;
          }
          if (!dataUrl) {
            throw new Error("No se pudo generar la imagen del QR.");
          }
          currentQrDataUrl = dataUrl;
          currentQrText = text;
          currentQrHistoryId = null;
        } catch (innerErr) {
          console.error(innerErr);
          showError("Ocurrió un error generando la imagen del QR.");
        }
      }, 30);

    } catch (e) {
      console.error(e);
      qrDisplay.classList.remove("has-qr");
      qrPlaceholder.style.display = "block";
      qrActions.style.display = "none";
      currentQrDataUrl = null;
      currentQrText = null;
      currentQrHistoryId = null;
      showError("No se pudo generar el código QR: " + (e && e.message ? e.message : "error desconocido"));
    }
  }

  function updateGenerateButtonState() {
    generateBtn.disabled = input.value.trim().length === 0;
  }

  generateBtn.addEventListener("click", generateQr);
  input.addEventListener("input", function(){
    clearError();
    updateGenerateButtonState();
  });
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      generateQr();
    }
  });

  saveBtn.addEventListener("click", saveToHistory);
  downloadBtn.addEventListener("click", downloadPng);
  clearAllBtn.addEventListener("click", clearAllHistory);

  // Init
  try {
    updateGenerateButtonState();
    renderHistory();
  } catch (e) {
    console.error("Error inicializando la app:", e);
    showError("Ocurrió un problema inicializando la aplicación. Intenta recargar la página.");
  }
})();
</script>

</body>
</html>
